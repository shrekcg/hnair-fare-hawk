<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="28" fill="#edf5f0"/>
  <style>.t{font:700 30px sans-serif;fill:#17231f}.h{font:700 22px sans-serif;fill:#17231f}.p{font:18px sans-serif;fill:#51605a}.box{fill:#fff;stroke:#16825d;stroke-width:3}.a{stroke:#d45532;stroke-width:5;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d45532"/></marker></defs>
  <text x="50" y="58" class="t">每位使用者绑定自己的微信通知</text>
  <rect x="50" y="112" width="235" height="200" rx="20" class="box"/><text x="80" y="158" class="h">1. 打开官网</text><text x="80" y="203" class="p">进入 SendKey 页面</text>
  <rect x="355" y="112" width="235" height="200" rx="20" class="box"/><text x="385" y="158" class="h">2. 微信登录</text><text x="385" y="203" class="p">本人扫码并配置通道</text>
  <rect x="660" y="112" width="235" height="200" rx="20" class="box"/><text x="690" y="158" class="h">3. 获取密钥</text><text x="690" y="203" class="p">复制自己的 SendKey</text>
  <rect x="965" y="112" width="185" height="200" rx="20" class="box"/><text x="995" y="158" class="h">4. 测试</text><text x="995" y="203" class="p">保存并发送测试</text>
  <path d="M295 212 H345" class="a"/><path d="M600 212 H650" class="a"/><path d="M905 212 H955" class="a"/>
  <text x="50" y="370" class="p">不要把自己的 SendKey 放进共享代码、截图或教程。</text>
</svg>
