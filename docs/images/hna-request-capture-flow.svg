<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">海航查询请求获取流程</title>
  <desc id="desc">登录官方页面，打开开发者工具，执行真实查询，筛选正确请求，复制为 cURL 并保存到本机。</desc>
  <defs>
    <style>
      .bg { fill: #f6f3ec; }
      .card { fill: #fffdf8; stroke: #24352f; stroke-width: 2; }
      .step { fill: #d94b32; }
      .num { fill: white; font: 700 22px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .head { fill: #17231f; font: 700 22px sans-serif; text-anchor: middle; }
      .body { fill: #52615b; font: 16px sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #d94b32; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .note { fill: #17231f; font: 700 17px sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="360" rx="24"/>
  <g transform="translate(35 55)">
    <rect class="card" width="190" height="190" rx="18"/>
    <circle class="step" cx="95" cy="42" r="24"/><text class="num" x="95" y="42">1</text>
    <text class="head" x="95" y="92">登录并查询</text>
    <text class="body" x="95" y="126">使用自己的账号</text>
    <text class="body" x="95" y="151">查询一条真实航线</text>
  </g>
  <path class="arrow" d="M235 150h35l-11-11m11 11-11 11"/>
  <g transform="translate(275 55)">
    <rect class="card" width="190" height="190" rx="18"/>
    <circle class="step" cx="95" cy="42" r="24"/><text class="num" x="95" y="42">2</text>
    <text class="head" x="95" y="92">打开 Network</text>
    <text class="body" x="95" y="126">选择 Fetch/XHR</text>
    <text class="body" x="95" y="151">清空旧请求</text>
  </g>
  <path class="arrow" d="M475 150h35l-11-11m11 11-11 11"/>
  <g transform="translate(515 55)">
    <rect class="card" width="190" height="190" rx="18"/>
    <circle class="step" cx="95" cy="42" r="24"/><text class="num" x="95" y="42">3</text>
    <text class="head" x="95" y="92">筛选正确请求</text>
    <text class="body" x="95" y="126">airLowFareSearch</text>
    <text class="body" x="95" y="151">响应有 airItineraries</text>
  </g>
  <path class="arrow" d="M715 150h35l-11-11m11 11-11 11"/>
  <g transform="translate(755 55)">
    <rect class="card" width="190" height="190" rx="18"/>
    <circle class="step" cx="95" cy="42" r="24"/><text class="num" x="95" y="42">4</text>
    <text class="head" x="95" y="92">复制为 cURL</text>
    <text class="body" x="95" y="126">右键 Copy</text>
    <text class="body" x="95" y="151">Copy as cURL (bash)</text>
  </g>
  <path class="arrow" d="M955 150h35l-11-11m11 11-11 11"/>
  <g transform="translate(995 55)">
    <rect class="card" width="170" height="190" rx="18"/>
    <circle class="step" cx="85" cy="42" r="24"/><text class="num" x="85" y="42">5</text>
    <text class="head" x="85" y="92">保存到本机</text>
    <text class="body" x="85" y="126">只告诉本地 AI</text>
    <text class="body" x="85" y="151">文件路径</text>
  </g>
  <rect x="120" y="285" width="960" height="45" rx="12" fill="#f0d7c5"/>
  <text class="note" x="600" y="313">cURL 含私人会话信息：不发群聊、不传网盘、不提交 GitHub</text>
</svg>
